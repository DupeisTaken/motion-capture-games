name: Repository CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Whitespace, local documentation links and offline reports
        run: node scripts/check-repository.mjs
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.event.merge_group.base_sha }}

  typescript:
    name: TypeScript / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-typescript
      - name: Contracts, types, lint, unit/replay/viewer tests and formatting
        run: pnpm check:typescript
      - name: Build workspace packages and every application entry
        run: pnpm build
      - name: Retain the verified frontend build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mirror-${{ matrix.os }}
          path: dist/mirror/
          if-no-files-found: error
          retention-days: 7

  python:
    name: Python vision / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      UV_PROJECT_ENVIRONMENT: .venv
      UV_PYTHON_INSTALL_DIR: .local/python
      UV_PYTHON_BIN_DIR: .local/python-bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Security-only CPython releases may be absent from setup-python's
      # Windows/macOS catalogs. Use the same managed runtime as local setup.
      - name: Install the pinned cross-platform Python runtime
        run: uv python install
      - name: Validate and install the Python lockfile
        run: uv sync --locked
      - name: Types, lint, synthetic API/tracking tests, format and byte compilation
        run: node scripts/tasks.mjs python-check

  # Keep the original check name stable for any existing branch protection.
  # A skipped/cancelled dependency must never turn the merge gate green.
  software-checks:
    name: software-checks
    if: ${{ always() }}
    needs: [repository, typescript, python]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI lane to succeed
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$TYPESCRIPT_RESULT" = success
          test "$PYTHON_RESULT" = success
