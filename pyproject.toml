[project]
name = "motion-capture-games"
version = "0.1.0"
description = "Local skeleton and person-count diagnostic middle layer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.2",
  "uvicorn==0.54.0",
  "numpy==2.3.5",
  "opencv-contrib-python==4.11.0.86",
  "mediapipe==0.10.32",
  "onnxruntime==1.23.2",
  "jsonschema==4.26.0",
  "fastjsonschema==2.22.3",
  "websockets==15.0.1",
  "cv2-enumerate-cameras==1.4.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx2==2.16.0", "ruff==0.17.4", "pyright==1.1.414"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["services/vision/tests"]
pythonpath = ["services/vision"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["services/vision/motion_vision", "services/vision/tools/xyz_benchmark.py", "services/vision/tools/rig_rehearsal.py"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
