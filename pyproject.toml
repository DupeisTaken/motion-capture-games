[project]
name = "motion-capture-xyz-experiment"
version = "0.1.0"
description = "Camera-free calibrated stereo reconstruction experiment; not a camera runtime"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.2.6"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3", "mypy==1.18.2"]

[tool.uv]
package = false
required-version = "==0.9.26"

[tool.pytest.ini_options]
pythonpath = ["services/vision", "experiments"]
testpaths = ["tests/vision"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tools/build_xyz_report.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["services/vision", "experiments"]
strict = true
